<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Guide List</title>  
    <link rel="stylesheet" href="html-ver.css" />
 
           
</head>
<body>
    
    <header>
        <div  class="logout"> 
            <h1>Your Guide List</h1>
            <button>Logout</button>
        </div>
    </header>


    <div> <!-- CONTAINER  -->         
        <div> <!-- container for list -->
            <div> <!-- individual list item -->

                
                
                <div class="list-item-container">
                    <button class="click-to-drag">1</button>

                    <button class="guide-list-item-btn">
                        <h3>Tokyo, Japan</h3>
                        <p>Dates: October 2025 to November 2025</p>
                        <p>Points of Interest: 43</p>
                    </button>
                 <div class="edit-delete-btns">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>

                </div>

                <div class="list-item-container">
                    <button class="click-to-drag">2</button>

                    <button class="guide-list-item-btn">
                        <h3>Mexico City, Mexico</h3>
                        <p>Dates: October 2026 to November 2026</p>
                        <p>Points of Interest: 55</p>
                    </button>
                    <div class="edit-delete-btns">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>

                </div>
            </div>
        </div>



    </div>




</body>
</html>
